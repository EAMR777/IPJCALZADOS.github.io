<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>IPJ Calzados · Inventario</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#dcdad2;--ac:#1f6f5c;--ac2:#fff;--rd:#b3261e;--am:#9a6700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--sf:#222220;--tx:#eeede8;--mu:#a09f97;--bd:#3a3935;--ac:#4cb89f;--ac2:#10201c;--rd:#f2877f;--am:#e0b04a}}
:root[data-theme="dark"]{--bg:#171716;--sf:#222220;--tx:#eeede8;--mu:#a09f97;--bd:#3a3935;--ac:#4cb89f;--ac2:#10201c;--rd:#f2877f;--am:#e0b04a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;padding:14px}
h1{font-size:20px;margin:0 0 12px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
button{cursor:pointer;font-weight:600}button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}button.s{padding:5px 9px;font-size:13px}
#q{flex:1;min-width:180px}.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}.k b{display:block;font-size:20px}.k span{color:var(--mu);font-size:12px}
.w{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}.n{text-align:right}.low{color:var(--rd);font-weight:700}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(440px,94vw)}
dialog::backdrop{background:#0008}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}dialog input,dialog select{width:100%}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.m{color:var(--mu);font-size:13px;margin:8px 0}.tabs button.on{border-color:var(--ac);color:var(--ac)}
</style><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e8;--sf:#fffdf8;--tx:#1a1814;--mu:#7a7365;--bd:#e0d8c6;--ac:#b8935a;--ac2:#14100a;--rd:#a8322a;--sr:'Cormorant Garamond',Georgia,serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b09;--sf:#16140f;--tx:#efe8d8;--mu:#a39a86;--bd:#2e2a20;--ac:#c9a56a;--ac2:#14100a;--rd:#ef8a7f}}
:root[data-theme="dark"]{--bg:#0c0b09;--sf:#16140f;--tx:#efe8d8;--mu:#a39a86;--bd:#2e2a20;--ac:#c9a56a;--ac2:#14100a;--rd:#ef8a7f}
body{font-family:Jost,system-ui,Segoe UI,Roboto,sans-serif;max-width:1180px;margin:0 auto}
.hd{background:#000;margin:-14px -14px 18px;padding:16px 14px 12px;text-align:center;border-bottom:2px solid var(--ac)}
.hd img{height:104px;max-width:75%;object-fit:contain}
.hd p{color:#c9a56a;letter-spacing:.35em;font-size:11px;text-transform:uppercase;margin:4px 0 0}
button{transition:.15s;letter-spacing:.02em}button:hover{border-color:var(--ac);color:var(--ac)}
button.p{background:linear-gradient(135deg,#d6b479,#b8935a 55%,#9c7a43);color:#14100a;border-color:#b8935a}
button.p:hover{color:#14100a;filter:brightness(1.08)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0;border-color:var(--ac)}
.k{border-top:3px solid var(--ac);padding:10px 18px;min-width:130px;box-shadow:0 1px 6px #0001}
.k b{font-family:var(--sr);font-size:30px;font-weight:700;line-height:1.1}.k span{text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.w{box-shadow:0 2px 10px #0001}th{color:var(--ac);letter-spacing:.12em;border-bottom:2px solid var(--ac);background:var(--bg)}
tbody tr:hover,tr:hover td{background:color-mix(in srgb,var(--ac) 9%,transparent)}
dialog{border:1px solid var(--ac);box-shadow:0 10px 40px #0007}dialog h3{font-family:var(--sr);font-size:24px;margin:0 0 4px;color:var(--ac)}
.tabs button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.m{text-align:center;margin-top:16px}.ft{text-align:center;color:var(--ac);font-family:var(--sr);font-size:18px;margin-top:6px;letter-spacing:.2em}
</style>

<div class="bar">
<input id="q" placeholder="Buscar por código (Enter)…" autocomplete="off">
<button class="p" onclick="render()">Buscar</button>
<button onclick="q.value='';render()">Ver todo</button>

</div>

<div class="ft">IPJ CALZADOS</div><p class="m">Los datos se guardan en este navegador. Haz un respaldo con frecuencia. Rojo = stock total bajo el mínimo.</p>

<dialog id="dl"><form method="dialog" id="fm" onsubmit="return false"><div id="dc"></div>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="button" onclick="dl.close()">Cancelar</button><button type="button" class="p" id="ok">Guardar</button></div></form></dialog>

<script>
let P=[],M=[],view=1;const $=id=>document.getElementById(id);
try{P=JSON.parse(localStorage.getItem('inv_p')||'[]');M=JSON.parse(localStorage.getItem('inv_m')||'[]')}catch(e){}
function save(){try{localStorage.setItem('inv_p',JSON.stringify(P));localStorage.setItem('inv_m',JSON.stringify(M))}catch(e){}}
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bs=n=>Number(n||0).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
const key=p=>p.codigo+'|'+p.talla;
q.addEventListener('keydown',e=>{if(e.key==='Enter')render()});
function tab(v){view=v;t1.classList.toggle('on',v==1);t2.classList.toggle('on',v==2);render()}
function render(){
 const f=q.value.trim().toLowerCase();
 const L=P.filter(p=>!f||p.codigo.toLowerCase().includes(f));
 const T=P.reduce((a,p)=>a+p.tienda,0),D=P.reduce((a,p)=>a+p.deposito,0),low=P.filter(p=>p.tienda+p.deposito<=p.min).length;
 $('kpi').innerHTML=`<div class="k"><b>${P.length}</b><span>Referencias</span></div><div class="k"><b>${T}</b><span>Uds. en tienda</span></div><div class="k"><b>${D}</b><span>Uds. en depósito</span></div><div class="k"><b class="${low?'low':''}">${low}</b><span>Stock bajo</span></div>`;
 if(view==2){const R=M.filter(m=>!f||m.codigo.toLowerCase().includes(f)).slice().reverse();
  $('tb').innerHTML='<tr><th>Fecha</th><th>Tipo</th><th>Código</th><th>Talla</th><th>Lugar</th><th class="n">Cant.</th><th>Nota</th></tr>'+(R.map(m=>`<tr><td>${E(m.f)}</td><td>${m.tipo}</td><td>${E(m.codigo)}</td><td>${E(m.talla)}</td><td>${m.lugar}</td><td class="n">${m.cant}</td><td>${E(m.nota)}</td></tr>`).join('')||'<tr><td colspan=7>Sin movimientos.</td></tr>');return}
 $('tb').innerHTML='<tr><th>Código</th><th>Marca</th><th>Talla</th><th>Descripción</th><th class="n">Tienda</th><th class="n">Depósito</th><th class="n">Total</th><th class="n">P. docena</th><th class="n">P. caja</th><th></th></tr>'+
 (L.map(p=>{const t=p.tienda+p.deposito,i=P.indexOf(p);return`<tr><td><b>${E(p.codigo)}</b></td><td>${E(p.marca)}</td><td>${E(p.talla)}</td><td>${E(p.desc)}</td><td class="n">${p.tienda}</td><td class="n">${p.deposito}</td><td class="n ${t<=p.min?'low':''}">${t}</td><td class="n">${bs(p.pDoc)}</td><td class="n">${bs(p.pCaja)}</td><td><button class="s" onclick="mov('salida',${i})">Salida</button> <button class="s" onclick="nuevo(${i})">Editar</button></td></tr>`}).join('')||'<tr><td colspan=10>Sin resultados. Usa “Nuevo producto”.</td></tr>')}
function open_(html,fn){$('dc').innerHTML=html;$('ok').onclick=()=>{if(fn()!==false)dl.close()};dl.showModal()}
const v=id=>$(id).value.trim(),nv=id=>Math.max(0,parseFloat($(id).value)||0);
function nuevo(i){const p=i==null?{codigo:'',marca:'',talla:'',desc:'',tienda:0,deposito:0,pDoc:0,pCaja:0,min:0}:P[i];
 open_(`<h3>${i==null?'Nuevo producto':'Editar producto'}</h3><div class="g"><div><label>Código</label><input id="a1" value="${E(p.codigo)}"></div><div><label>Marca</label><input id="a2" value="${E(p.marca)}"></div>
 <div><label>Talla</label><input id="a3" value="${E(p.talla)}" placeholder="Ej: 38, M, 36-42"></div><div><label>Stock mínimo</label><input id="a4" type="number" min="0" value="${p.min}"></div></div>
 <label>Descripción</label><input id="a5" value="${E(p.desc)}"><div class="g"><div><label>Cantidad en tienda</label><input id="a6" type="number" min="0" value="${p.tienda}"></div><div><label>Cantidad en depósito</label><input id="a7" type="number" min="0" value="${p.deposito}"></div>
 <div><label>Precio por docena</label><input id="a8" type="number" min="0" step="0.01" value="${p.pDoc}"></div><div><label>Precio por caja</label><input id="a9" type="number" min="0" step="0.01" value="${p.pCaja}"></div></div>`,()=>{
  const n={codigo:v('a1'),marca:v('a2'),talla:v('a3'),desc:v('a5'),tienda:nv('a6'),deposito:nv('a7'),pDoc:nv('a8'),pCaja:nv('a9'),min:nv('a4')};
  if(!n.codigo){alert('El código es obligatorio');return false}
  if(P.some((x,j)=>j!==i&&key(x)===key(n))){alert('Ya existe ese código con esa talla');return false}
  if(i==null){P.push(n);log('alta',n,'tienda',n.tienda,'Producto nuevo');if(n.deposito)log('alta',n,'depósito',n.deposito,'Producto nuevo')}else P[i]=n;
  save();render()})}
function log(tipo,p,lugar,cant,nota){M.push({f:new Date().toLocaleString('es'),tipo,codigo:p.codigo,talla:p.talla,lugar,cant,nota})}
function mov(tipo,i){if(!P.length){alert('Primero agrega productos');return}
 const f=q.value.trim().toLowerCase();let opts=P.map((p,j)=>`<option value="${j}" ${j===i?'selected':''}>${E(p.codigo)} · ${E(p.talla)} · ${E(p.marca)} (T:${p.tienda} D:${p.deposito})</option>`).join('');
 const tt={salida:'Registrar salida',entrada:'Registrar entrada',traslado:'Traslado depósito → tienda'}[tipo];
 open_(`<h3>${tt}</h3><label>Producto</label><select id="b1">${opts}</select>`+(tipo=='traslado'?'':`<label>Lugar</label><select id="b2"><option>tienda</option><option>depósito</option></select>`)+
 `<label>Cantidad</label><input id="b3" type="number" min="1" value="1"><label>Nota (venta, cliente, motivo…)</label><input id="b4">`,()=>{
  const p=P[+$('b1').value],c=nv('b3'),nota=v('b4');if(c<=0){alert('Cantidad inválida');return false}
  if(tipo=='traslado'){if(p.deposito<c){alert('Solo hay '+p.deposito+' en depósito');return false}p.deposito-=c;p.tienda+=c;log('traslado',p,'depósito→tienda',c,nota)}
  else{const l=$('b2').value=='tienda'?'tienda':'deposito';
   if(tipo=='salida'){if(p[l]<c){alert('Solo hay '+p[l]+' en '+$('b2').value);return false}p[l]-=c}else p[l]+=c;log(tipo,p,$('b2').value,c,nota)}
  save();render()})}
function dwn(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function csv(){const r=[['Marca','Código','Talla','Descripción','Tienda','Depósito','Total','P. docena','P. caja','Mínimo']].concat(P.map(p=>[p.marca,p.codigo,p.talla,p.desc,p.tienda,p.deposito,p.tienda+p.deposito,p.pDoc,p.pCaja,p.min]));
 dwn('inventario.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv')}
function resp(){dwn('respaldo-inventario.json',JSON.stringify({P,M}),'application/json')}
rest.onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);P=d.P||[];M=d.M||[];save();render()}catch(x){alert('Archivo inválido')}})};
render();
</script></body></html>
